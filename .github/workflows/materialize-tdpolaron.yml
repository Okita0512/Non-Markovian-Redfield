name: Materialize TD-polaron sources

on:
  push:
    branches:
      - feature/constant-bias-td-polaron-nz2
    paths:
      - unpack_tdpolaron.py
      - .github/workflows/materialize-tdpolaron.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/constant-bias-td-polaron-nz2
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install numerical dependencies
        run: python -m pip install --upgrade numpy numba

      - name: Unpack implementation
        run: python unpack_tdpolaron.py

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Commit generated source files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md TD_POLARON.md Methods/TDPolaronNZ2.py Models/SpinBoson_Benchmarks.py run_tdpolaron.py tests/test_tdpolaron.py
          git commit -m "Implement constant-bias TD-polaron NZ2 benchmarks"
          git push origin HEAD:feature/constant-bias-td-polaron-nz2
